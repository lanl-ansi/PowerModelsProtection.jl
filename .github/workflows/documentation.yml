name: Documentation
on:
  push:
    branches: [master]
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  docs:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Install Dependencies
        # PowerModelsDistribution v0.17 is not yet registered; use the branch that carries the ONM compatibility fixes
        run: julia --project=docs -e 'using Pkg; Pkg.add(PackageSpec(url="https://github.com/lanl-ansi/PowerModelsDistribution.jl", rev="onm-compat-fixes")); Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs docs/make.jl
